name: trans_app
description: Realtime Vietnamese-English voice translator for online calls on Windows (Discord first).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_secure_storage: ^9.2.4
  logging: ^1.3.0
  shared_preferences: ^2.5.3
  win_audio:
    path: ../packages/win_audio

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
