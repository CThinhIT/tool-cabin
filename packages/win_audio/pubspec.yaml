name: win_audio
description: >-
  Windows audio I/O for the translator app over dart:ffi: WASAPI capture of a
  microphone or of one app's process tree (process loopback), low-latency PCM
  playback into a chosen device, and per-app session volume.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
